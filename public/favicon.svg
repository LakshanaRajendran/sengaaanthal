<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="tabShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <g filter="url(#tabShadow)">
    <!-- OUTER BOLD BLACK CONTOUR (ensures crisp visibility on light tabs and dark tabs alike) -->
    <g stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="#000000">
      <!-- Curved Stem / Pedicel -->
      <path d="M32 46 C32 52 31 56 31 60" />
      
      <!-- Characteristic Outward Spreading Stamens -->
      <path d="M30 45 Q20 45 12 49" />
      <path d="M31 46 Q24 53 19 57" />
      <path d="M34 45 Q44 45 52 49" />
      <path d="M33 46 Q40 53 45 57" />
      
      <!-- Pistil / Style bent downward -->
      <path d="M32 46 L32 54 M29 57 L32 54 L35 57" />

      <!-- Horizontal Versatile Anthers -->
      <line x1="8" y1="48" x2="16" y2="50" stroke-width="5.5" />
      <line x1="16" y1="56" x2="22" y2="59" stroke-width="5.5" />
      <line x1="48" y1="50" x2="56" y2="48" stroke-width="5.5" />
      <line x1="42" y1="59" x2="48" y2="56" stroke-width="5.5" />

      <!-- 6 Reflexed Undulating Flame Petals (Gloriosa Superba) -->
      <!-- Center Upright Flame Petal -->
      <path d="M32 44 C27 34 37 25 31 16 C28 10 32 4 32 4 C32 4 36 10 33 16 C27 25 37 34 32 44 Z" />
      
      <!-- Left Inner Wavy Flame Petal -->
      <path d="M31 44 C22 36 30 27 23 18 C19 12 24 6 24 6 C24 6 28 13 24 20 C32 28 23 37 31 44 Z" />
      
      <!-- Right Inner Wavy Flame Petal -->
      <path d="M33 44 C42 36 34 27 41 18 C45 12 40 6 40 6 C40 6 36 13 40 20 C32 28 41 37 33 44 Z" />
      
      <!-- Left Outer Sweeping Flame Petal -->
      <path d="M30 45 C15 45 8 35 12 25 C14 20 12 12 12 12 C12 12 18 18 16 26 C13 34 22 41 30 45 Z" />
      
      <!-- Right Outer Sweeping Flame Petal -->
      <path d="M34 45 C49 45 56 35 52 25 C50 20 52 12 52 12 C52 12 46 18 48 26 C51 34 42 41 34 45 Z" />
    </g>

    <!-- INNER CRISP WHITE OUTLINE (clean Black & White botanical line art) -->
    <g stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Slender Stem -->
      <path d="M32 46 C32 52 31 56 31 60" />

      <!-- Spreading Stamens (Filaments) -->
      <path d="M30 45 Q20 45 12 49" stroke-width="1.8" />
      <path d="M31 46 Q24 53 19 57" stroke-width="1.8" />
      <path d="M34 45 Q44 45 52 49" stroke-width="1.8" />
      <path d="M33 46 Q40 53 45 57" stroke-width="1.8" />

      <!-- Deflexed Style / Pistil -->
      <path d="M32 46 L32 54 M29 57 L32 54 L35 57" stroke-width="1.8" />

      <!-- Anthers -->
      <line x1="8" y1="48" x2="16" y2="50" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" />
      <line x1="16" y1="56" x2="22" y2="59" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" />
      <line x1="48" y1="50" x2="56" y2="48" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" />
      <line x1="42" y1="59" x2="48" y2="56" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" />

      <!-- Center Node -->
      <circle cx="32" cy="45" r="1.8" fill="#FFFFFF" />

      <!-- Characteristic Wavy Reflexed Petals (Filled with semi-transparent black for depth) -->
      <!-- Center Petal -->
      <path d="M32 44 C27 34 37 25 31 16 C28 10 32 4 32 4 C32 4 36 10 33 16 C27 25 37 34 32 44 Z" fill="#000000" fill-opacity="0.4" />
      <path d="M32 42 L32 8" stroke-width="1" stroke-dasharray="2 1.5" opacity="0.85" />

      <!-- Left Inner Petal -->
      <path d="M31 44 C22 36 30 27 23 18 C19 12 24 6 24 6 C24 6 28 13 24 20 C32 28 23 37 31 44 Z" fill="#000000" fill-opacity="0.4" />
      <path d="M29 42 Q23 30 24 10" stroke-width="1" stroke-dasharray="2 1.5" opacity="0.85" />

      <!-- Right Inner Petal -->
      <path d="M33 44 C42 36 34 27 41 18 C45 12 40 6 40 6 C40 6 36 13 40 20 C32 28 41 37 33 44 Z" fill="#000000" fill-opacity="0.4" />
      <path d="M35 42 Q41 30 40 10" stroke-width="1" stroke-dasharray="2 1.5" opacity="0.85" />

      <!-- Left Outer Sweeping Petal -->
      <path d="M30 45 C15 45 8 35 12 25 C14 20 12 12 12 12 C12 12 18 18 16 26 C13 34 22 41 30 45 Z" fill="#000000" fill-opacity="0.4" />
      <path d="M28 44 Q14 36 13 18" stroke-width="0.9" stroke-dasharray="2 1.5" opacity="0.8" />

      <!-- Right Outer Sweeping Petal -->
      <path d="M34 45 C49 45 56 35 52 25 C50 20 52 12 52 12 C52 12 46 18 48 26 C51 34 42 41 34 45 Z" fill="#000000" fill-opacity="0.4" />
      <path d="M36 44 Q50 36 51 18" stroke-width="0.9" stroke-dasharray="2 1.5" opacity="0.8" />
    </g>
  </g>
</svg>